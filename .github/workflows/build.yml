name: Build and Archive RedAlert2 Web

on:
  push:
    branches: [ "main" "build" "dev" ]
  pull_request:
    branches: [ "main" "build" "dev" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 安装 Bun 环境 (项目文档指定使用 Bun)
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.10  # 匹配 README 中的版本

      # 2. 安装依赖
      - name: Install dependencies
        run: bun install

      # 4. 执行生产环境构建
      # 执行后会生成 dist 文件夹
      - name: Build project
        run: bun run build

      # 5. 上传构建产物 (dist 目录)
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ra2web-dist  # 压缩包名称
          path: dist/        # Vite 默认输出目录
